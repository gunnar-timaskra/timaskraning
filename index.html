  function checkGPS() {

    return;

async function updateWorkButtons(employeeId) {
  const { data, error } = await db
    .from("time_entries")
    .select("id")
    .eq("employee_id", employeeId)
    .is("clock_out", null)
    .limit(1)
    .maybeSingle();

  if (error) return;

  const clockInBtn = document.getElementById("clockInBtn");
  const clockOutBtn = document.getElementById("clockOutBtn");

  if (data) {
    clockInBtn.style.display = "none";
    clockOutBtn.style.display = "block";
  } else {
    clockInBtn.style.display = "block";
    clockOutBtn.style.display = "none";
  }
}
  
  async function loadTodayHours(employeeId) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const { data, error } = await db
    .from("time_entries")
    .select("clock_in, clock_out")
    .eq("employee_id", employeeId)
    .gte("clock_in", today.toISOString())
    .order("clock_in", { ascending: true });

  if (error || !data) return;

  let dayHours = 0;
  let extraHours = 0;

  data.forEach(entry => {
    const end = entry.clock_out ? entry.clock_out : new Date().toISOString();
    const hours = calculateWorkHours(entry.clock_in, end);
    dayHours += hours.dayHours;
    extraHours += hours.nightHours;
  });

  document.getElementById("dayHours").textContent = dayHours.toFixed(2);
  document.getElementById("extraHours").textContent = extraHours.toFixed(2);
  document.getElementById("totalHours").textContent =
    (dayHours + extraHours).toFixed(2);
}  
  function calculateWorkHours(clockIn, clockOut) {
  const start = new Date(clockIn);
  const end = clockOut ? new Date(clockOut) : new Date();

  if (end <= start) {
    return { dayHours: 0, nightHours: 0, totalHours: 0 };
  }

  const totalHours = (end - start) / 3600000;

  // Venjuleg dagvinna getur hafist fyrir kl. 16:00.
  // Fyrstu 8 tímarnir eru dagvinna, en aldrei lengur en til kl. 16:00.
  // Ef vinna hefst kl. 16:00 eða síðar fer allur tíminn í álag.
  const sixteen = new Date(start);
  sixteen.setHours(16, 0, 0, 0);

  let dayHours = 0;

  if (start < sixteen) {
    const hoursUntil16 = Math.max(0, (sixteen - start) / 3600000);
    dayHours = Math.min(totalHours, 8, hoursUntil16);
  }

  const nightHours = Math.max(0, totalHours - dayHours);

  return {
    dayHours,
    nightHours,
    totalHours
  };
}

clock_out: clockOutTime

  async function exportExcel() {
  const month = document.getElementById("adminMonth")?.value;

  if (!month) {
    alert("Veldu fyrst mánuð í stjórnborðinu.");
    return;
  }

  const start = month + "-01";
  const [year, monthNumber] = month.split("-").map(Number);
  const end = new Date(Date.UTC(year, monthNumber, 1))
    .toISOString().slice(0, 10);

  const { data: employees, error: employeeError } = await db
    .from("employees")
    .select("id, name")
    .eq("active", true);

  if (employeeError) {
    alert("Villa: " + employeeError.message);
    return;
  }

  const { data: entries, error } = await db
    .from("time_entries")
    .select("*")
    .gte("clock_in", start)
    .lt("clock_in", end)
    .order("clock_in");

  if (error) {
    alert("Villa: " + error.message);
    return;
  }

  const rows = [
    ["Starfsmaður", "Dagsetning", "Mæting", "Vinnulok",
     "Dagvinna", "Yfirvinna", "Samtals"]
  ];

  for (const entry of entries) {
    const employee = employees.find(e => e.id === entry.employee_id);
    const hours = calculateWorkHours(entry.clock_in, entry.clock_out);

    rows.push([
      employee?.name || "Óþekktur",
      new Date(entry.clock_in).toLocaleDateString("is-IS"),
      new Date(entry.clock_in).toLocaleTimeString("is-IS"),
      entry.clock_out
        ? new Date(entry.clock_out).toLocaleTimeString("is-IS")
        : "",
      hours.dayHours,
      hours.nightHours,
      hours.totalHours
    ]);
  }

  const csv = "\uFEFF" + rows.map(row =>
    row.map(value =>
      '"' + String(value ?? "").replace(/"/g, '""') + '"'
    ).join(";")
  ).join("\r\n");

  const blob = new Blob([csv], {
    type: "text/csv;charset=utf-8;"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "Timaskraning-" + month + ".csv";
  link.click();
  URL.revokeObjectURL(url);
}
