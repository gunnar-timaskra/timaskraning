<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tímaskráning</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 22px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      background: #2563eb;
      color: white;
    }

    .logout {
      background: #555;
      color: white;
    }

    .error {
      color: #b91c1c;
      margin-top: 16px;
      text-align: center;
    }

    .success {
      color: #15803d;
      margin-top: 16px;
      text-align: center;
    }

    #app {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="loginCard" class="card">
    <h1>Tímaskráning</h1>
    <div class="subtitle">Starfsmannakerfi</div>

    <label>Netfang</label>
    <input id="email" type="email" placeholder="Netfang">

    <label>Lykilorð</label>
    <input id="password" type="password" placeholder="Lykilorð">

    <button class="login" onclick="login()">Skrá inn</button>

    <div id="message"></div>
  </div>

  <div id="app" class="card">
    <h1>Tímaskráning</h1>

    <p>Innskráður:</p>
    <h2 id="employeeName"></h2>

    <div id="adminStatus"></div>

 <div id="worksiteInfo">
  <p><strong>Vinnustaður:</strong> <span id="worksiteName">Hleð...</span></p>
  <p><strong>Heimilisfang:</strong> <span id="worksiteAddress">Hleð...</span></p>
</div>
<div id="gpsStatus">
  <p><strong>GPS:</strong> <span id="gpsText">Athuga staðsetningu...</span></p>
</div>
    
<button id="clockInBtn" onclick="clockIn()" style="background:#28a745; color:white; margin-bottom:12px;">
  Mæta / Hefja vinnu
</button>
   <div id="todayHours" style="margin:20px 0; padding:15px; background:#f3f4f6; border-radius:10px;">
  <strong>Vinnutími í dag</strong><br>
  Dagvinna: <span id="dayHours">0.00</span> klst.<br>
  Nætur/álag: <span id="extraHours">0.00</span> klst.<br>
  Samtals: <span id="totalHours">0.00</span> klst.
</div> 
  <button id="clockOutBtn" onclick="clockOut()" style="background:#c62828; color:white; margin-bottom:12px;">Hætta / Ljúka vinnu</button>
   <button id="adminBtn" style="display:none;" onclick="openAdmin()">Stjórnborð</button> 
    <button class="logout" onclick="logout()">Skrá út</button>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://zrwahisbxzqeehvkhags.supabase.co";
  const SUPABASE_KEY = "sb_publishable_5nTASM9lJS_z1I6POeSS5Q_C6_QzPvh";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    message.className = "";
    message.textContent = "Skrái inn...";

    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      message.className = "error";
      message.textContent = "Innskráning mistókst. Athugaðu netfang og lykilorð.";
      return;
    }

    await loadEmployee(data.user.id);
  }

  async function loadEmployee(userId) {
    const { data, error } = await db
      .from("employees")
      .select("id, name, is_admin")
      .eq("auth_user_id", userId)
      .single();

    if (error || !data) {
      document.getElementById("message").className = "error";
      document.getElementById("message").textContent =
        "Starfsmaður fannst ekki í kerfinu.";
      return;
    }

    document.getElementById("loginCard").style.display = "none";
    document.getElementById("app").style.display = "block";

    document.getElementById("employeeName").textContent = data.name;

    document.getElementById("adminStatus").innerHTML =
      data.is_admin
        ? '<p class="success"><strong>Stjórnandi</strong></p>'
        : '<p>Starfsmaður</p>';
    document.getElementById("adminBtn").style.display = data.is_admin ? "block" : "none";
  await loadWorksite();
await loadTodayHours(data.id);
  await updateWorkButtons(data.id);  
  }
  checkGPS();
async function loadWorksite() {
  const { data, error } = await db
    .from("worksites")
    .select("id, name, address, latitude, longitude, gps_radius_m")
    .eq("active", true)
    .order("id")
    .limit(1)
    .single();

  if (error || !data) {
    document.getElementById("worksiteInfo").innerHTML =
      "<p>Enginn virkur vinnustaður fannst.</p>";
    return;
  }

  document.getElementById("worksiteInfo").innerHTML =
    "<strong>" + data.name + "</strong><br>" +
    (data.address || "");
}

  function checkGPS() {
  const gpsText = document.getElementById("gpsText");

  if (!navigator.geolocation) {
    gpsText.textContent = "GPS er ekki stutt í þessu tæki";
    return;
  }

  gpsText.textContent = "Leita að staðsetningu...";

  navigator.geolocation.getCurrentPosition(
    (position) => {
      gpsText.textContent = "GPS tengt ✓";
    },
    (error) => {
      gpsText.textContent = "GPS staðsetning ekki tiltæk";
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}
  
async function clockIn() {
const { data: { user } } = await db.auth.getUser();

if (!user) {
  alert("Þú ert ekki innskráður.");
  return;
}
  const { data: employee, error } = await db
  .from("employees")
  .select("id")
  .eq("auth_user_id", user.id)
  .single();

if (error || !employee) {
  alert("Starfsmaður fannst ekki.");
  return;
}

  const { data: worksite } = await db
  .from("worksites")
  .select("id")
  .eq("active", true)
  .order("id")
  .limit(1)
  .single();

if (!worksite) {
  alert("Enginn virkur vinnustaður fannst.");
  return;
}
  const { error: insertError } = await db
  .from("time_entries")
  .insert({
    employee_id: employee.id,
    worksite_id: worksite.id,
    clock_in: new Date().toISOString()
  });

if (insertError) {
  alert("Villa við að skrá mætingu: " + insertError.message);
  return;
}
alert("Mæting skráð ✓");
 await
updateWorkButtons(employee.id); 
}
async function updateWorkButtons(employeeId) {
  const { data, error } = await db
    .from("time_entries")
    .select("id")
    .eq("employee_id", employeeId)
    .is("clock_out", null)
    .limit(1)
    .maybeSingle();

  if (error) return;

  const clockInBtn = document.getElementById("clockInBtn");
  const clockOutBtn = document.getElementById("clockOutBtn");

  if (data) {
    clockInBtn.style.display = "none";
    clockOutBtn.style.display = "block";
  } else {
    clockInBtn.style.display = "block";
    clockOutBtn.style.display = "none";
  }
}
  
  async function loadTodayHours(employeeId) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const { data, error } = await db
    .from("time_entries")
    .select("clock_in, clock_out")
    .eq("employee_id", employeeId)
    .gte("clock_in", today.toISOString())
    .order("clock_in", { ascending: true });

  if (error || !data) return;

  let dayHours = 0;
  let extraHours = 0;

  data.forEach(entry => {
    const end = entry.clock_out ? entry.clock_out : new Date().toISOString();
    const hours = calculateWorkHours(entry.clock_in, end);
    dayHours += hours.dayHours;
    extraHours += hours.extraHours;
  });

  document.getElementById("dayHours").textContent = dayHours.toFixed(2);
  document.getElementById("extraHours").textContent = extraHours.toFixed(2);
  document.getElementById("totalHours").textContent =
    (dayHours + extraHours).toFixed(2);
}  
  
  function calculateWorkHours(clockIn, clockOut) {
  const start = new Date(clockIn);
  const end = new Date(clockOut);

  let dayMinutes = 0;
  let extraMinutes = 0;

  let current = new Date(start);

  while (current < end) {
    const next = new Date(Math.min(current.getTime() + 60000, end.getTime()));

    const icelandTime = new Date(
      current.toLocaleString("en-US", { timeZone: "Atlantic/Reykjavik" })
    );

    const hour = icelandTime.getHours();

    if (hour >= 8 && hour < 16) {
      dayMinutes += (next - current) / 60000;
    } else {
      extraMinutes += (next - current) / 60000;
    }

    current = next;
  }

  return {
    dayHours: dayMinutes / 60,
    extraHours: extraMinutes / 60
  };
}

async function clockOut() {
  const { data: { user } } = await db.auth.getUser();

  if (!user) {
    alert("Þú ert ekki innskráður.");
    return;
  }

  const { data: employee, error: employeeError } = await db
    .from("employees")
    .select("id")
    .eq("auth_user_id", user.id)
    .single();

  if (employeeError || !employee) {
    alert("Starfsmaður fannst ekki.");
    return;
  }

  const { data: entry, error: findError } = await db
    .from("time_entries")
    .select("id,clock_in")
    .eq("employee_id", employee.id)
    .is("clock_out", null)
    .order("clock_in", { ascending: false })
    .limit(1)
    .maybeSingle();

  if (findError || !entry) {
    alert("Engin opin mæting fannst.");
    return;
  }
const clockOutTime = new Date().toISOString();
const hours = calculateWorkHours(entry.clock_in, clockOutTime);

alert(
  "Dagvinna: " + hours.dayHours.toFixed(2) + " klst.\n" +
  "Nætur/álag: " + hours.extraHours.toFixed(2) + " klst."
);
  const { error: updateError } = await db
    .from("time_entries")
    .update({
clock_out: clockOutTime      
    })
    .eq("id", entry.id);

  if (updateError) {
    alert("Villa við að ljúka vinnu: " + updateError.message);
    return;
  }

  alert("Vinnu lokið ✓");
  await loadTodayHours(employee.id);
await updateWorkButtons(employee.id);
}
  
async function openAdmin() {
  const { data: employees, error: employeeError } = await db
    .from("employees")
    .select("id, name, is_admin, active")
    .eq("active", true)
    .order("name");

  if (employeeError) {
    alert("Villa við að sækja starfsmenn: " + employeeError.message);
    return;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate() + 1);

  const { data: entries, error: timeError } = await db
    .from("time_entries")
    .select("employee_id, clock_in, clock_out")
    .gte("clock_in", today.toISOString())
    .lt("clock_in", tomorrow.toISOString());

  if (timeError) {
    alert("Villa við að sækja vinnutíma: " + timeError.message);
    return;
  }

  let text = "STJÓRNBORÐ - VINNUTÍMI Í DAG\n\n";

  employees.forEach(employee => {
    const employeeEntries = entries.filter(
      entry => entry.employee_id === employee.id
    );

    let totalHours = 0;

    employeeEntries.forEach(entry => {
      const start = new Date(entry.clock_in);
      const end = entry.clock_out ? new Date(entry.clock_out) : new Date();
      totalHours += Math.max(0, (end - start) / 3600000);
    });

    const dayHours = Math.min(totalHours, 8);
    const extraHours = Math.max(totalHours - 8, 0);

    text += employee.name + "\n";
    text += "Dagvinna: " + dayHours.toFixed(2) + " klst.\n";
    text += "Nætur/álag: " + extraHours.toFixed(2) + " klst.\n";
    text += "Samtals: " + totalHours.toFixed(2) + " klst.\n\n";
  });

  alert(text);
}
  async function logout() {
    await db.auth.signOut();
    location.reload();
  }

  async function checkSession() {
    const { data } = await db.auth.getSession();

    if (data.session) {
      await loadEmployee(data.session.user.id);
    }
  }

  checkSession();
</script>

</body>
